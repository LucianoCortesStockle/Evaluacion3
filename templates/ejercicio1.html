<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 1 - notas</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <h2>Formulario de Notas</h2>
    <form method="POST">
        <label>Nota 1:</label>
        <input type="number" name="nota1" min="10" max="70" required><br>

        <label>Nota 2:</label>
        <input type="number" name="nota2" min="10" max="70" required><br>

        <label>Nota 3:</label>
        <input type="number" name="nota3" min="10" max="70" required><br>

        <label>Asistencia:</label>
        <input type="number" name="asistencia" min="0" max="100" step="any" required><br>

        <button type="submit" class="btn">Enviar</button>
    </form>
    <br>
    <a href="{{ url_for('index') }}">Volver al menú</a>
</body>
</html>
